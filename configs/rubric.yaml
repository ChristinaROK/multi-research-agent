# Outcomes-style rubric — finding 1건을 5개 항목으로 채점.
#
# 기존 Verifier 가 "통계적 재현/강건성" 을 통과시킨 finding 만 이 grader 에 들어옵니다.
# Grader 는 그 위에서 "메타 적합성" (인과 명료성, proxy 강도, 외부 검증성, 억지 회피, baseline 존재) 을 채점합니다.
#
# 두산 사례 (부정 기사 80%면 주가 6% 하락) 같은 reference test case 는 평균 7~9점이 나와야 한다.
# 광고 선호도 → 비용 효율성, 기사 수 × 예상 비용 같은 기존 실패 패턴은 4점 이하가 나와야 한다.
# 둘 다 안 맞으면 사람이 rubric 자체를 고친다.
#
# Phase 1: src/multi_research_agent/grader/rubric.py 가 이 yaml 을 읽고 Anthropic SDK 로 직접 채점.
# Phase 3: Anthropic Managed Agents 의 beta.outcomes 로 마이그레이션 (criteria 구조 호환).
#
# YAML 작성 규칙: 한국어 텍스트에 콜론(:) 이 들어가면 mapping 으로 오해되므로 모든 scoring_guide
#                value 와 multi-line 텍스트는 block scalar (`|`) 사용.

version: 1
name: brand_value_finding_rubric
description: |
  SK 지주사 외부 평판/브랜드 활동이 NAV 할인율(또는 주가)에 미치는 영향을 측정한 finding 의
  메타 적합성을 채점하는 rubric. 0~10점, 가중 평균.

aggregate:
  pass_threshold: 7.0      # 가중 평균 7.0 이상 → significant_promoted (findings 등록)
  retry_threshold: 5.0     # 5.0~6.9 → needs_refinement (worker 1회 재시도)
  fail_threshold: 5.0      # 5.0 미만 → rejected_by_rubric (methodology_graveyard 보관)
  retry_max: 1             # 동일 finding 1회까지만 grader 재시도 (echo chamber 방지)

criteria:
  - name: causal_path_clarity
    weight: 0.25
    label_ko: 인과 경로 명료성
    description: |
      X(팩터)에서 Y(NAV 할인율/주가)까지의 인과 경로가 명확한가.
      중간 단계가 모두 검증 가능한 메커니즘으로 연결되어 있는가.
    scoring_guide:
      "9-10": |
        X→중간1→중간2→Y 모든 단계가 선행 연구 또는 공시 데이터로 검증됨
      "6-8": |
        주요 단계는 검증되나 1~2 단계는 추정 또는 약한 인용
      "0-5": |
        X와 Y 사이 직접 연결, 중간 메커니즘 누락 또는 한 줄짜리 점프
    failure_anchor: |
      "광고 선호도 상승 → 비용 효율성 개선" 처럼 중간 매개변수 없는 점프.
      유튜브 조회수 같은 약한 proxy 를 시가총액에 바로 연결.

  - name: proxy_strength
    weight: 0.20
    label_ko: proxy 강도
    description: |
      X와 Y의 측정 변수가 실제로 X와 Y를 충분히 대표하는가.
      잡음 대비 신호가 충분한가.
    scoring_guide:
      "9-10": |
        공시/감사 가능한 1차 자료. 측정 직접성 ≥ 0.8
      "6-8": |
        공개 데이터이나 잡음 일부 (예 - 등급 자체보다 등급 발표 이벤트)
      "0-5": |
        추정값, 우회 측정, 수집 비용이 효과를 압도하는 noise
    failure_anchor: |
      "유튜브 조회수" 로 기업가치 측정. "언론 기사 수 × 추정 광고비" 로 PR 효과 측정.

  - name: external_verifiability
    weight: 0.20
    label_ko: 외부 공개 데이터로 검증 가능성
    description: |
      내부 자료 없이도 1차 신뢰성 확보가 가능한가.
      DART, KIND, 거래소, KCGS 등으로 재현 가능한가.
    scoring_guide:
      "9-10": |
        100% 공개 데이터로 재현 가능. 모든 source URL 명시
      "6-8": |
        주요 부분 공개, 일부 내부 자료(광고비 등)가 보강 필요
      "0-5": |
        내부 자료 없이 결과 자체가 안 나옴 (= reproducibility risk)
    failure_anchor: |
      "내부 마케팅 ROI 모델" 로 결과를 만들고 외부 검증 경로 없음.

  - name: not_forced
    weight: 0.25      # 5개 중 가장 무거움 — Jin이 가장 경계하는 항목
    label_ko: 억지 회피 (forced logic 차단)
    description: |
      사후 합리화나 데이터 마사지의 흔적이 없는가.
      독립 관찰자(예 - SK 담당자 동료)가 "그럴 듯하다" 라고 동의할 만한 논리인가.
      변수 선택, 기간 선택, 정제 규칙이 결과를 만들기 위해 사후에 정해진 흔적이 있는가.
    scoring_guide:
      "9-10": |
        사전 등록된 분석 설계가 brief 에 있음. 변수/기간/정제 규칙 사전 명시
      "6-8": |
        대부분 사전 명시되었으나 일부 사후 결정 (그리고 그것을 인정)
      "0-5": |
        결과를 본 뒤 변수를 바꾼 흔적, p-hacking 의심, 기간을 결과에 맞춰 자름
    failure_anchor: |
      "기사 건수 × 추정 광고비" 같은 계산식 자체가 임의.
      "두산 사례에 맞춰 80% 임계값을 정했다" 같은 사후 정렬.
      여러 모델 중 유의한 것만 보고.

  - name: comparable_baseline
    weight: 0.10
    label_ko: 비교 가능 baseline 존재
    description: |
      효과 크기가 비교 가능한 baseline 또는 control 과 함께 제시되는가.
    scoring_guide:
      "9-10": |
        동종 업계 비교 또는 시기별/포트폴리오사별 명확한 baseline
      "6-8": |
        부분적 baseline, 또는 placebo test 일부 수행
      "0-5": |
        절대값만 제시, 비교 대상 없음 ("0.3 상관 발견" 만 적힘)
    failure_anchor: |
      "SK 의 상관계수가 0.4" 만 적고 다른 지주사 또는 다른 시기의 상관은 없음.

# Few-shot reference cases — Phase 1 (사람 합의) 단계에서 SK 담당자와 함께 채점.
# 채점 시 grader prompt 에 이 reference 를 inject 해서 calibration 한다.
reference_cases:
  - case_id: doosan_negative_press
    summary: |
      두산 - 부정적 기사 비율이 80% 를 넘는 분기에 주가가 평균 6.2% 하락
      (2018~2024, 분기별 패널, n=24)
    expected_score_range: [7.0, 9.0]
    why: |
      인과 경로 명확(부정 기사 → 투자자 sentiment → 매도) +
      proxy 분명(기사 톤 분류) + 외부 검증 가능(네이버 뉴스 + 거래소) +
      baseline 존재(80% 미만 분기와 비교). 단 not_forced 는 8 정도
      (80% 임계값은 사후 결정 가능성 있음 → 부분 감점).

  - case_id: esg_rating_foreign_flow
    summary: |
      SK㈜ ESG 등급 (KCGS) 상향 발표일 ± 5거래일에 외국인 순매수가 평소 대비
      평균 +N% 증가하고, NAV 할인율이 0.5~1.5%p 축소되는 경향이 관측됨
      (2018~2025, KCGS 발표 이벤트 n=8). 사용자(SK 리서치팀)가 제시한 가설.
    expected_score_range: [7.0, 8.5]
    why: |
      causal_path 명확(ESG 등급 → 패시브 ETF 편입 변화 → 외국인 수급 → 가격) +
      proxy 측정 가능(KCGS 발표일 + pykrx 외국인 순매수). external_verifiability 9점.
      not_forced 는 7~8 정도 (이벤트 윈도우 ± 5일은 사전 등록 명시 필요).
      baseline 은 비-발표 분기와 비교 가능.

  - case_id: buyback_announcement_discount
    summary: |
      SK㈜ 자사주 매입 발표일 ± 20거래일에 NAV 할인율이 1~3%p 축소 (event study).
      대조군: 같은 시기 매입 발표가 없었던 동종 지주사 분기들.
    expected_score_range: [7.5, 9.0]
    why: |
      거버넌스 영역의 고전적 이벤트. proxy_strength 매우 강(DART 공시 = 정확한 발표일).
      causal_path 명확(자사주 매입 → 발행주식수 감소 → EPS 상승 + 신호 효과).
      not_forced 8점(윈도우 사전 명시 시), baseline 양호.

  - case_id: forced_ad_preference
    summary: |
      광고 선호도 +10%p 상승 → 비용 효율성 개선 → 매출 +X% → 시가총액 영향 추정
    expected_score_range: [2.0, 4.0]
    why: |
      causal_path 6점 이하(중간 단계 없음), not_forced 3점 이하(매출과 시총 연결 임의),
      baseline 없음. 기존 실패 패턴의 전형. 사용자(SK)가 명시적으로 회피 요청한 패턴.

  - case_id: news_count_times_estimated_cpc
    summary: |
      SK 관련 기사 건수에 예상 광고 단가를 곱해 PR 의 광고 환산 가치를 계산
    expected_score_range: [1.0, 3.0]
    why: |
      proxy_strength 1~2점(기사 수가 평판을 측정하지 않음),
      not_forced 1~2점(계산식 자체가 임의), external_verifiability 6점 정도.
      사용자(SK)가 명시적으로 회피 요청한 패턴.

  - case_id: youtube_views_market_cap
    summary: |
      SK 브랜드 유튜브 채널 조회수와 SK㈜ 시가총액의 단순 회귀 (r = 0.3)
    expected_score_range: [1.5, 3.5]
    why: |
      proxy_strength 매우 약함(조회수는 기업가치를 측정하지 않음).
      causal_path 누락(조회수 → 시총 사이 메커니즘 없음). 사용자가 회피 요청.

# Grader 단계별 호출 정책 (cost 통제)
grading_policy:
  stage1_sift:
    model: claude-haiku-4-5
    purpose: |
      명백한 실패(평균 추정 < 4점)는 빠르게 거름. 점수 분산이 큰 항목 표시.
      borderline (6점 부근) 또는 high (7점 이상) 후보만 stage2 로.
    max_tokens: 1500
  stage2_precision:
    model: claude-opus-4-7
    purpose: |
      stage1 이 borderline/high 로 표시한 finding 만 정밀 채점.
      reference_cases 를 calibration 으로 inject.
    max_tokens: 4000
  prompt_cache: true     # rubric + reference_cases 는 매 호출 동일 → 캐시
